<!DOCTYPE html>
<html lang="en" class="dark">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KHELZONE | Create Account</title>


<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>


<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>


<!-- Material Icons -->
<link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family: "Inter", sans-serif;

    background:
        radial-gradient(
            circle at top right,
            rgba(255, 90, 0, 0.18),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(255, 90, 0, 0.08),
            transparent 30%
        ),
        #08090b;

    color: white;
}


.signup-card {

    background: rgba(18, 20, 24, 0.94);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255, 255, 255, 0.09);

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(255, 90, 0, 0.05);
}


.orange-gradient {

    background:
        linear-gradient(
            135deg,
            #ff5a00 0%,
            #d63f00 100%
        );
}


.orange-gradient:hover {

    background:
        linear-gradient(
            135deg,
            #ff6818 0%,
            #d63f00 100%
        );
}


.orange-gradient:disabled,
button:disabled {

    cursor: not-allowed;
}


.input-box {

    background: rgba(255, 255, 255, 0.04) !important;

    border:
        1px solid
        rgba(255, 255, 255, 0.10) !important;

    color: white !important;
}


.input-box:focus {

    border-color: #ff5a00 !important;

    box-shadow:
        0 0 0 3px
        rgba(255, 90, 0, 0.12) !important;
}


.input-box::placeholder {

    color: #6b7280;
}


.spinner {

    width: 19px;

    height: 19px;

    border:
        2px solid
        rgba(255,255,255,0.35);

    border-top-color: white;

    border-radius: 50%;

    animation:
        spin 0.7s linear infinite;
}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}

</style>

</head>


<body class="flex items-center justify-center px-4 py-10">


<main class="w-full max-w-md">


<!-- =====================================================
     LOGO
===================================================== -->

<a
    href="homepage.html"
    class="block text-center mb-8"
>

    <div
        class="text-4xl sm:text-5xl font-black tracking-tight text-orange-500"
    >
        KHELZONE
    </div>

    <div
        class="mt-2 text-[10px] sm:text-xs font-bold tracking-[0.28em] text-gray-500"
    >
        ENGINEERED FOR PERFORMANCE
    </div>

</a>



<!-- =====================================================
     SIGNUP CARD
===================================================== -->

<section
    id="signupCard"
    class="signup-card rounded-3xl p-6 sm:p-8"
>


<!-- =====================================================
     SIGNUP SCREEN
===================================================== -->

<div id="signupScreen">


    <!-- HEADER -->

    <div class="text-center mb-7">

        <div
            class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-orange-500/10 border border-orange-500/20"
        >

            <span
                class="material-symbols-outlined text-orange-500 text-3xl"
            >
                person_add
            </span>

        </div>


        <h1 class="mt-5 text-3xl font-black uppercase">
            Create Account
        </h1>


        <p class="mt-2 text-sm text-gray-500">
            Join KHELZONE today
        </p>

    </div>



    <!-- =================================================
         SIGNUP FORM
    ================================================= -->

    <form
        id="signupForm"
        class="space-y-5"
        novalidate
    >


        <!-- NAME -->

        <div>

            <label
                for="fullName"
                class="mb-2 block text-xs font-bold uppercase tracking-wider text-gray-400"
            >
                Full Name
            </label>


            <input
                id="fullName"
                type="text"
                required
                autocomplete="name"
                placeholder="e.g. Abdullah Qasmi"
                class="input-box w-full rounded-xl px-4 py-3.5 outline-none transition"
            >

        </div>



        <!-- EMAIL -->

        <div>

            <label
                for="email"
                class="mb-2 block text-xs font-bold uppercase tracking-wider text-gray-400"
            >
                Email
            </label>


            <input
                id="email"
                type="email"
                required
                autocomplete="email"
                placeholder="Enter your email"
                class="input-box w-full rounded-xl px-4 py-3.5 outline-none transition"
            >


            <p
                id="emailHint"
                class="mt-2 hidden text-[11px]"
            ></p>

        </div>



        <!-- PASSWORD -->

        <div>

            <label
                for="password"
                class="mb-2 block text-xs font-bold uppercase tracking-wider text-gray-400"
            >
                Password
            </label>


            <div class="relative">

                <input
                    id="password"
                    type="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Minimum 8 characters"
                    class="input-box w-full rounded-xl px-4 py-3.5 pr-12 outline-none transition"
                >


                <button
                    type="button"
                    id="togglePassword"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white"
                >

                    <span
                        id="passwordIcon"
                        class="material-symbols-outlined"
                    >
                        visibility
                    </span>

                </button>

            </div>


            <p class="mt-2 text-[11px] text-gray-600">
                At least 8 characters with 1 letter and 1 number.
            </p>

        </div>



        <!-- CONFIRM PASSWORD -->

        <div>

            <label
                for="confirmPassword"
                class="mb-2 block text-xs font-bold uppercase tracking-wider text-gray-400"
            >
                Confirm Password
            </label>


            <input
                id="confirmPassword"
                type="password"
                required
                minlength="8"
                autocomplete="new-password"
                placeholder="Confirm your password"
                class="input-box w-full rounded-xl px-4 py-3.5 outline-none transition"
            >

        </div>



        <!-- MESSAGE -->

        <div
            id="message"
            class="hidden rounded-xl border px-4 py-3 text-sm font-semibold"
        ></div>



        <!-- SIGNUP BUTTON -->

        <button
            id="signupBtn"
            type="submit"
            class="orange-gradient w-full rounded-xl py-4 font-black uppercase tracking-wide text-white flex items-center justify-center gap-2 transition hover:scale-[1.01] active:scale-[0.99]"
        >

            <span id="signupBtnText">
                Create Account
            </span>


            <span
                id="signupSpinner"
                class="spinner hidden"
            ></span>


            <span
                id="signupIcon"
                class="material-symbols-outlined"
            >
                arrow_forward
            </span>

        </button>


    </form>



    <!-- LOGIN -->

    <div class="mt-7 text-center">

        <p class="text-sm text-gray-500">

            Already have an account?

            <a
                href="index.html"
                class="font-bold text-orange-400 hover:text-orange-300"
            >
                Login
            </a>

        </p>

    </div>



    <!-- BACK TO LOGIN -->

    <div class="mt-7 border-t border-white/10 pt-6">

        <a
            href="index.html"
            class="flex items-center justify-center gap-2 text-sm text-gray-500 hover:text-white"
        >

            <span
                class="material-symbols-outlined text-base"
            >
                arrow_back
            </span>

            Back to Login

        </a>

    </div>


</div>


</section>



<!-- COPYRIGHT -->

<p class="mt-6 text-center text-[10px] text-gray-600">

    © 2026 KHELZONE. Engineered for Performance.

</p>


</main>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

"use strict";


/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://antqexjhlsaynunlmzqa.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_pGWCdhUgU9p4JTWUwSnj5g_1TosZQLu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================================
   ELEMENTS
========================================================= */

const signupForm =
    document.getElementById("signupForm");


const fullNameInput =
    document.getElementById("fullName");


const emailInput =
    document.getElementById("email");


const emailHint =
    document.getElementById("emailHint");


const passwordInput =
    document.getElementById("password");


const confirmPasswordInput =
    document.getElementById("confirmPassword");


const togglePassword =
    document.getElementById("togglePassword");


const passwordIcon =
    document.getElementById("passwordIcon");


const signupBtn =
    document.getElementById("signupBtn");


const signupBtnText =
    document.getElementById("signupBtnText");


const signupSpinner =
    document.getElementById("signupSpinner");


const signupIcon =
    document.getElementById("signupIcon");


const message =
    document.getElementById("message");


let isSigningUp = false;



/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type = "error") {

    message.textContent = text;

    message.className =
        "rounded-xl border px-4 py-3 text-sm font-semibold";

    message.classList.remove("hidden");


    if (type === "success") {

        message.classList.add(
            "bg-green-500/10",
            "border-green-500/20",
            "text-green-300"
        );

    } else {

        message.classList.add(
            "bg-red-500/10",
            "border-red-500/20",
            "text-red-300"
        );

    }

}



function hideMessage() {

    message.textContent = "";

    message.classList.add("hidden");

}



/* =========================================================
   LOADING
========================================================= */

function setLoading(loading) {

    isSigningUp = loading;

    signupBtn.disabled = loading;


    if (loading) {

        signupBtnText.textContent =
            "Creating...";

        signupSpinner.classList.remove(
            "hidden"
        );

        signupIcon.classList.add(
            "hidden"
        );


        signupBtn.classList.add(
            "opacity-70",
            "cursor-not-allowed"
        );


    } else {

        signupBtnText.textContent =
            "Create Account";

        signupSpinner.classList.add(
            "hidden"
        );

        signupIcon.classList.remove(
            "hidden"
        );


        signupBtn.classList.remove(
            "opacity-70",
            "cursor-not-allowed"
        );

    }

}



/* =========================================================
   PASSWORD SHOW / HIDE
========================================================= */

togglePassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            passwordIcon.textContent =
                "visibility_off";


        } else {

            passwordInput.type =
                "password";

            passwordIcon.textContent =
                "visibility";

        }

    }
);



/* =========================================================
   FULL NAME VALIDATION
========================================================= */

function isValidFullName(name) {

    const namePattern =
        /^[A-Za-z]+(?:[ '-][A-Za-z]+)+(?:\s+[A-Za-z]+(?:[ '-][A-Za-z]+)+)*$/;

    return namePattern.test(
        name.trim()
    );

}



/* =========================================================
   EMAIL VALIDATION
========================================================= */

function isValidEmail(email) {

    if (!email) return false;

    if (email.length > 254)
        return false;

    if (/\s/.test(email))
        return false;


    const emailPattern =
        /^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$/;


    return emailPattern.test(email);

}



/* =========================================================
   DISPOSABLE EMAIL DOMAINS
========================================================= */

const blockedEmailDomains = [

    "tempmail.com",

    "10minutemail.com",

    "guerrillamail.com",

    "mailinator.com",

    "yopmail.com",

    "throwawaymail.com",

    "temp-mail.org",

    "fakeinbox.com",

    "sharklasers.com",

    "trashmail.com",

    "dispostable.com",

    "mintemail.com",

    "getnada.com",

    "maildrop.cc",

    "mohmal.com",

    "tempinbox.com",

    "moakt.com",

    "emailondeck.com",

    "spamgourmet.com",

    "mailnesia.com"

];



function isBlockedEmailDomain(email) {

    const domain =
        email
            .split("@")[1]
            ?.toLowerCase();


    return blockedEmailDomains.includes(
        domain
    );

}



/* =========================================================
   PASSWORD VALIDATION
========================================================= */

function isValidPassword(password) {

    const passwordPattern =
        /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;


    return passwordPattern.test(
        password
    );

}



/* =========================================================
   EMAIL LIVE CHECK
========================================================= */

emailInput.addEventListener(
    "blur",
    function () {

        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        emailHint.classList.add(
            "hidden"
        );


        if (!email)
            return;


        if (!isValidEmail(email)) {

            emailHint.textContent =
                "Please enter a valid email address.";

            emailHint.className =
                "mt-2 text-[11px] text-red-400";

            return;

        }


        if (
            isBlockedEmailDomain(email)
        ) {

            emailHint.textContent =
                "Temporary or disposable email addresses are not allowed.";

            emailHint.className =
                "mt-2 text-[11px] text-red-400";

            return;

        }


        emailHint.textContent =
            "Email looks good.";

        emailHint.className =
            "mt-2 text-[11px] text-green-400";

    }
);



/* =========================================================
   CREATE ACCOUNT
========================================================= */

signupForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        if (isSigningUp)
            return;


        hideMessage();


        const fullName =
            fullNameInput.value
                .trim()
                .replace(/\s+/g, " ");


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;



        /* =================================================
           NAME
        ================================================= */

        if (!fullName) {

            showMessage(
                "Enter your full name."
            );

            fullNameInput.focus();

            return;

        }


        if (!isValidFullName(fullName)) {

            showMessage(
                "Enter your full name correctly, e.g. Abdullah Qasmi."
            );

            fullNameInput.focus();

            return;

        }



        /* =================================================
           EMAIL
        ================================================= */

        if (!email) {

            showMessage(
                "Please enter your email address."
            );

            emailInput.focus();

            return;

        }


        if (!isValidEmail(email)) {

            showMessage(
                "Please enter a valid email address."
            );

            emailInput.focus();

            return;

        }


        if (
            isBlockedEmailDomain(email)
        ) {

            showMessage(
                "Temporary or disposable email addresses are not allowed."
            );

            emailInput.focus();

            return;

        }



        /* =================================================
           PASSWORD
        ================================================= */

        if (!isValidPassword(password)) {

            showMessage(
                "Password must be at least 8 characters and contain at least 1 letter and 1 number."
            );

            passwordInput.focus();

            return;

        }



        /* =================================================
           CONFIRM PASSWORD
        ================================================= */

        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "Passwords do not match."
            );

            confirmPasswordInput.focus();

            return;

        }



        /* =================================================
           START ACCOUNT CREATION
        ================================================= */

        setLoading(true);


        try {


            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            full_name:
                                fullName,

                            role:
                                "customer"

                        }

                    }

                });



            /* =================================================
               SUPABASE ERROR
            ================================================= */

            if (error) {

                throw error;

            }



            /* =================================================
               CHECK USER
            ================================================= */

            if (
                !data ||
                !data.user
            ) {

                throw new Error(
                    "Account could not be created."
                );

            }



            /* =================================================
               SUCCESS
            ================================================= */

            showMessage(
                "Account created successfully! Redirecting to login...",
                "success"
            );


            setLoading(false);



            /* =================================================
               LOGOUT CURRENT SESSION
            ================================================= */

            await supabaseClient.auth.signOut();



            /* =================================================
               REDIRECT TO LOGIN
            ================================================= */

            setTimeout(
                function () {

                    window.location.href =
                        "index.html";

                },
                1200
            );


        } catch (error) {


            console.error(
                "KHELZONE SIGNUP ERROR:",
                error
            );


            let errorMessage =
                error?.message ||
                "Account could not be created.";


            const lower =
                errorMessage.toLowerCase();


            const code =
                error?.code || "";



            /* =================================================
               ALREADY REGISTERED
            ================================================= */

            if (

                code ===
                    "user_already_exists"

                ||

                lower.includes(
                    "user already registered"
                )

                ||

                lower.includes(
                    "already been registered"
                )

                ||

                lower.includes(
                    "already exists"
                )

            ) {

                errorMessage =
                    "This email already has an account. Please login instead.";

            }



            /* =================================================
               INVALID EMAIL
            ================================================= */

            else if (

                lower.includes(
                    "invalid email"
                )

                ||

                lower.includes(
                    "invalid format"
                )

            ) {

                errorMessage =
                    "Please enter a valid email address.";

            }



            /* =================================================
               PASSWORD ERROR
            ================================================= */

            else if (
                lower.includes("password")
            ) {

                errorMessage =
                    "Password must be at least 8 characters and contain 1 letter and 1 number.";

            }



            /* =================================================
               RATE LIMIT
            ================================================= */

            else if (

                lower.includes("rate")

                ||

                lower.includes("too many")

            ) {

                errorMessage =
                    "Too many attempts. Please wait a little and try again.";

            }



            /* =================================================
               NETWORK ERROR
            ================================================= */

            else if (

                lower.includes("network")

                ||

                lower.includes("fetch")

            ) {

                errorMessage =
                    "Network error. Please check your internet connection and try again.";

            }



            /* =================================================
               SHOW ERROR
            ================================================= */

            showMessage(
                errorMessage,
                "error"
            );


            setLoading(false);

        }

    }
);

</script>


</body>
</html>
