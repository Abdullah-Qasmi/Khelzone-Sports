<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHELZONE | Admin Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--orange:#ff6a00;--bg:#0b0b0b;--panel:#141414;--line:#292929}
    body{background:var(--bg);color:#fff;font-family:Arial,sans-serif}
    .panel{background:var(--panel);border:1px solid var(--line)}
    input,select,textarea{background:#0e0e0e!important;border:1px solid #333!important;color:#fff!important}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange)!important}
    .btn{background:var(--orange);color:#fff;font-weight:800}
    .btn:hover{filter:brightness(1.08)}
    .danger{background:#b42318}
    .muted{color:#999}
    .thumb{width:72px;height:72px;object-fit:cover;background:#0d0d0d;border-radius:10px}
  </style>
</head>
<body>
  <!-- Hidden shop iframe initializes the default 352-product catalog once. -->
  <iframe id="shopInit" src="shop.html" style="display:none"></iframe>

  <header class="border-b border-white/10 sticky top-0 bg-black/95 backdrop-blur z-20">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <div>
        <p class="text-xs font-bold tracking-[.25em]" style="color:var(--orange)">KHELZONE</p>
        <h1 class="text-2xl font-black">PRODUCT ADMIN</h1>
      </div>
      <a href="shop.html" target="_blank" class="px-4 py-2 rounded-lg border border-white/20 text-sm font-bold">OPEN SHOP ↗</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div id="status" class="hidden mb-5 rounded-xl px-4 py-3 text-sm"></div>

    <section class="panel rounded-2xl p-5 mb-8">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div>
          <h2 id="formTitle" class="text-xl font-black">ADD PRODUCT</h2>
          <p class="muted text-sm">Upload an image, set the price, and save.</p>
        </div>
        <button id="cancelBtn" class="hidden px-4 py-2 rounded-lg border border-white/20 text-sm font-bold">CANCEL EDIT</button>
      </div>

      <form id="productForm" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        <input type="hidden" id="productId">

        <label class="text-sm font-bold">Product name
          <input id="name" required class="mt-2 w-full rounded-lg px-3 py-3" placeholder="Example: Pro Football">
        </label>

        <label class="text-sm font-bold">Price (Rs.)
          <input id="price" required type="number" min="0" step="1" class="mt-2 w-full rounded-lg px-3 py-3" placeholder="2500">
        </label>

        <label class="text-sm font-bold">Old price (Rs.)
          <input id="oldPrice" type="number" min="0" step="1" class="mt-2 w-full rounded-lg px-3 py-3" placeholder="3000">
        </label>

        <label class="text-sm font-bold">Sport
          <select id="sport" class="mt-2 w-full rounded-lg px-3 py-3">
            <option>Football</option><option>Cricket</option><option>Tennis</option>
            <option>Basketball</option><option>Volleyball</option><option>Badminton</option>
            <option>Fitness</option><option>Running</option><option>Boxing</option>
            <option>Hockey</option><option>Accessories</option>
          </select>
        </label>

        <label class="text-sm font-bold">Category
          <input id="category" required class="mt-2 w-full rounded-lg px-3 py-3" placeholder="Shoes, Balls, Jerseys...">
        </label>

        <label class="text-sm font-bold">Brand
          <input id="brand" class="mt-2 w-full rounded-lg px-3 py-3" placeholder="KHELZONE">
        </label>

        <label class="text-sm font-bold">Stock
          <input id="stock" type="number" min="0" step="1" value="10" class="mt-2 w-full rounded-lg px-3 py-3">
        </label>

        <label class="text-sm font-bold">Badge
          <select id="badge" class="mt-2 w-full rounded-lg px-3 py-3">
            <option value="">None</option><option>NEW</option><option>SALE</option>
            <option>BEST SELLER</option><option>TRENDING</option><option>LIMITED</option><option>TOP RATED</option>
          </select>
        </label>

        <label class="text-sm font-bold">Image
          <input id="imageFile" type="file" accept="image/*" class="mt-2 w-full rounded-lg px-3 py-2">
          <span class="block muted text-xs mt-1">PNG/JPG/WebP. Image is compressed before saving.</span>
        </label>

        <label class="text-sm font-bold lg:col-span-3">Description
          <textarea id="description" rows="3" class="mt-2 w-full rounded-lg px-3 py-3" placeholder="Product description"></textarea>
        </label>

        <div class="lg:col-span-3 flex flex-wrap gap-3">
          <button class="btn px-6 py-3 rounded-lg" type="submit" id="saveBtn">SAVE PRODUCT</button>
          <button class="px-6 py-3 rounded-lg border border-white/20 font-bold" type="button" id="clearBtn">CLEAR</button>
        </div>
      </form>
    </section>

    <section class="panel rounded-2xl p-5">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div>
          <h2 class="text-xl font-black">ALL PRODUCTS</h2>
          <p id="count" class="muted text-sm"></p>
        </div>
        <div class="flex gap-2">
          <input id="search" class="rounded-lg px-3 py-2 text-sm" placeholder="Search products...">
          <button id="resetBtn" class="danger px-4 py-2 rounded-lg text-sm font-bold">RESET CATALOG</button>
        </div>
      </div>
      <div id="products" class="space-y-3"></div>
    </section>
  </main>

<script>
const KEY = "khz_products_v1";
let products = [];
let editingId = null;

const $ = id => document.getElementById(id);
const money = n => "Rs. " + Number(n || 0).toLocaleString("en-PK");

function showStatus(msg, ok=true){
  const el=$("status");
  el.textContent=msg;
  el.className="mb-5 rounded-xl px-4 py-3 text-sm " + (ok ? "bg-emerald-900/40 text-emerald-300" : "bg-red-900/40 text-red-300");
}

function load(){
  try{
    products=JSON.parse(localStorage.getItem(KEY) || "[]");
  }catch(e){ products=[]; }
  render();
}

function save(){
  localStorage.setItem(KEY, JSON.stringify(products));
  render();
}

function render(){
  const q=$("search").value.trim().toLowerCase();
  const filtered=products.filter(p => (p.name+" "+p.sport+" "+p.category+" "+p.brand).toLowerCase().includes(q));
  $("count").textContent=`${filtered.length} of ${products.length} products`;
  $("products").innerHTML=filtered.map(p=>`
    <div class="flex flex-wrap items-center gap-4 p-3 rounded-xl border border-white/10 bg-black/20">
      <img class="thumb" src="${escapeAttr(p.image)}" onerror="this.style.opacity=.3">
      <div class="flex-1 min-w-[220px]">
        <div class="font-black">${escapeHtml(p.name)}</div>
        <div class="text-xs muted mt-1">${escapeHtml(p.sport)} · ${escapeHtml(p.category)} · ${escapeHtml(p.brand || "KHELZONE")}</div>
      </div>
      <div class="font-black" style="color:var(--orange)">${money(p.price)}</div>
      <div class="text-xs muted">Stock: ${Number(p.stock||0)}</div>
      <button class="edit px-4 py-2 rounded-lg border border-white/20 text-sm font-bold" data-id="${p.id}">EDIT</button>
      <button class="delete danger px-4 py-2 rounded-lg text-sm font-bold" data-id="${p.id}">DELETE</button>
    </div>
  `).join("") || `<p class="muted text-center py-12">No products found.</p>`;

  document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>editProduct(Number(b.dataset.id)));
  document.querySelectorAll(".delete").forEach(b=>b.onclick=()=>deleteProduct(Number(b.dataset.id)));
}

function escapeHtml(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function escapeAttr(v){ return escapeHtml(v); }

function resetForm(){
  editingId=null;
  $("productId").value="";
  $("productForm").reset();
  $("stock").value=10;
  $("formTitle").textContent="ADD PRODUCT";
  $("saveBtn").textContent="SAVE PRODUCT";
  $("cancelBtn").classList.add("hidden");
}

function editProduct(id){
  const p=products.find(x=>Number(x.id)===id);
  if(!p)return;
  editingId=id;
  $("productId").value=id;
  $("name").value=p.name||"";
  $("price").value=p.price||0;
  $("oldPrice").value=p.oldPrice||0;
  $("sport").value=p.sport||"Accessories";
  $("category").value=p.category||"Accessories";
  $("brand").value=p.brand||"KHELZONE";
  $("stock").value=p.stock??0;
  $("badge").value=p.badge||"";
  $("description").value=p.description||"";
  $("imageFile").value="";
  $("formTitle").textContent="EDIT PRODUCT";
  $("saveBtn").textContent="UPDATE PRODUCT";
  $("cancelBtn").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

function deleteProduct(id){
  const p=products.find(x=>Number(x.id)===id);
  if(!p)return;
  if(!confirm(`Delete "${p.name}"?`))return;
  products=products.filter(x=>Number(x.id)!==id);
  save();
  showStatus("Product deleted.");
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    if(!file){resolve(null);return;}
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=1000;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",.78));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

$("productForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const name=$("name").value.trim();
  const price=Number($("price").value);
  if(!name || !Number.isFinite(price) || price<0){
    showStatus("Enter a valid product name and price.",false); return;
  }

  const file=$("imageFile").files[0];
  let image=null;
  try{ image=await compressImage(file); }
  catch(err){ showStatus("Could not read that image.",false); return; }

  const old=editingId ? products.find(p=>Number(p.id)===editingId) : null;
  const product={
    id: editingId || (products.length ? Math.max(...products.map(p=>Number(p.id)||0))+1 : 1),
    name,
    category:$("category").value.trim() || "Accessories",
    sport:$("sport").value,
    price,
    oldPrice:Number($("oldPrice").value)||price,
    discount: Number($("oldPrice").value)>price ? Math.round((1-price/Number($("oldPrice").value))*100) : 0,
    rating: old?.rating ?? 5,
    reviews: old?.reviews ?? 0,
    image:image || old?.image || "",
    description:$("description").value.trim() || "Quality sports gear from KHELZONE.",
    sizes:old?.sizes || ["Standard"],
    stock:Math.max(0,Number($("stock").value)||0),
    badge:$("badge").value,
    brand:$("brand").value.trim() || "KHELZONE"
  };

  if(editingId){
    products=products.map(p=>Number(p.id)===editingId ? product : p);
    showStatus("Product updated. Open/refresh shop.html to see the change.");
  }else{
    products.push(product);
    showStatus("Product added. Open/refresh shop.html to see it.");
  }

  save();
  resetForm();
});

$("cancelBtn").onclick=resetForm;
$("clearBtn").onclick=resetForm;
$("search").oninput=render;

$("resetBtn").onclick=()=>{
  if(!confirm("This clears the saved catalog. Open shop.html once afterward to restore the original 352 products. Continue?"))return;
  localStorage.removeItem(KEY);
  products=[];
  render();
  showStatus("Saved catalog cleared. Open shop.html to restore the original catalog.");
};

document.getElementById("shopInit").addEventListener("load",()=>{
  setTimeout(load,300);
});
setTimeout(load,1000);
</script>
</body>
</html>
