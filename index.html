<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KHELZONE | Login</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- Material Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        rel="stylesheet"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(255, 90, 0, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(255, 90, 0, 0.08),
                    transparent 30%
                ),
                #08090b;
            color: #ffffff;
        }

        .login-card {
            background: rgba(18, 20, 24, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.09);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                0 0 40px rgba(255, 90, 0, 0.05);
        }

        .orange-gradient {
            background: linear-gradient(
                135deg,
                #ff5a00 0%,
                #d63f00 100%
            );
        }

        .orange-gradient:hover {
            background: linear-gradient(
                135deg,
                #ff6818 0%,
                #d63f00 100%
            );
        }

        .input-box {
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid rgba(255, 255, 255, 0.10) !important;
            color: #ffffff !important;
        }

        .input-box:focus {
            border-color: #ff5a00 !important;
            box-shadow:
                0 0 0 3px rgba(255, 90, 0, 0.12) !important;
        }

        .input-box::placeholder {
            color: #6b7280;
        }

        .spinner {
            width: 19px;
            height: 19px;

            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;

            border-radius: 50%;

            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message {
            transition: all 0.2s ease;
        }
    </style>
</head>


<body class="flex items-center justify-center px-4 py-10">

    <main class="w-full max-w-md">

        <!-- =====================================================
             LOGO
        ====================================================== -->

        <a
            href="homepage.html"
            class="block text-center mb-8"
        >

            <div
                class="
                    text-4xl
                    sm:text-5xl
                    font-black
                    tracking-tight
                    text-orange-500
                "
            >
                KHELZONE
            </div>

            <div
                class="
                    mt-2
                    text-[10px]
                    sm:text-xs
                    font-bold
                    tracking-[0.28em]
                    text-gray-500
                "
            >
                ENGINEERED FOR PERFORMANCE
            </div>

        </a>


        <!-- =====================================================
             LOGIN CARD
        ====================================================== -->

        <section
            class="
                login-card
                rounded-3xl
                p-6
                sm:p-8
            "
        >

            <!-- =================================================
                 TITLE
            ================================================== -->

            <div class="text-center mb-7">

                <div
                    class="
                        mx-auto
                        flex
                        h-16
                        w-16
                        items-center
                        justify-center
                        rounded-2xl
                        bg-orange-500/10
                        border
                        border-orange-500/20
                    "
                >

                    <span
                        class="
                            material-symbols-outlined
                            text-orange-500
                            text-3xl
                        "
                    >
                        lock
                    </span>

                </div>


                <h1
                    class="
                        mt-5
                        text-3xl
                        font-black
                        uppercase
                    "
                >
                    Welcome Back
                </h1>


                <p class="mt-2 text-sm text-gray-500">
                    Login to your KHELZONE account
                </p>

            </div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="loginForm"
                class="space-y-5"
            >

                <!-- EMAIL -->

                <div>

                    <label
                        for="email"
                        class="
                            mb-2
                            block
                            text-xs
                            font-bold
                            uppercase
                            tracking-wider
                            text-gray-400
                        "
                    >
                        Email
                    </label>


                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        placeholder="Enter your email"

                        class="
                            input-box
                            w-full
                            rounded-xl
                            px-4
                            py-3.5
                            outline-none
                            transition
                        "
                    >

                </div>


                <!-- PASSWORD -->

                <div>

                    <label
                        for="password"
                        class="
                            mb-2
                            block
                            text-xs
                            font-bold
                            uppercase
                            tracking-wider
                            text-gray-400
                        "
                    >
                        Password
                    </label>


                    <div class="relative">

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                            placeholder="Enter your password"

                            class="
                                input-box
                                w-full
                                rounded-xl
                                px-4
                                py-3.5
                                pr-12
                                outline-none
                                transition
                            "
                        >


                        <button
                            type="button"
                            id="togglePassword"

                            class="
                                absolute
                                right-3
                                top-1/2
                                -translate-y-1/2
                                text-gray-500
                                hover:text-white
                                transition
                            "

                            aria-label="Show password"
                        >

                            <span
                                id="passwordIcon"
                                class="
                                    material-symbols-outlined
                                "
                            >
                                visibility
                            </span>

                        </button>

                    </div>

                </div>


                <!-- MESSAGE -->

                <div
                    id="message"
                    class="
                        message
                        hidden
                        rounded-xl
                        border
                        px-4
                        py-3
                        text-sm
                        font-semibold
                    "
                ></div>


                <!-- LOGIN BUTTON -->

                <button
                    id="loginBtn"
                    type="submit"

                    class="
                        orange-gradient
                        w-full
                        rounded-xl
                        py-4
                        font-black
                        uppercase
                        tracking-wide
                        text-white
                        flex
                        items-center
                        justify-center
                        gap-2
                        transition
                        hover:scale-[1.01]
                        active:scale-[0.99]
                    "
                >

                    <span id="loginBtnText">
                        Login
                    </span>


                    <span
                        id="loginSpinner"
                        class="spinner hidden"
                    ></span>


                    <span
                        id="loginIcon"
                        class="
                            material-symbols-outlined
                        "
                    >
                        arrow_forward
                    </span>

                </button>

            </form>


            <!-- =================================================
                 SIGN UP
            ================================================== -->

            <div class="mt-7 text-center">

                <p class="text-sm text-gray-500">

                    Don't have an account?

                    <a
                        href="signup.html"
                        class="
                            font-bold
                            text-orange-400
                            hover:text-orange-300
                        "
                    >
                        Create account
                    </a>

                </p>

            </div>


            <!-- =================================================
                 BECOME SELLER
            ================================================== -->

            <div class="mt-5 text-center">

                <p class="text-sm text-gray-500">

                    Want to sell on KHELZONE?

                    <a
                        href="become a seller.html"
                        class="
                            font-bold
                            text-orange-400
                            hover:text-orange-300
                        "
                    >
                        Become a Seller
                    </a>

                </p>

            </div>


            <!-- =================================================
                 HOME
            ================================================== -->

            <div
                class="
                    mt-7
                    border-t
                    border-white/10
                    pt-6
                "
            >

                <a
                    href="homepage.html"

                    class="
                        flex
                        items-center
                        justify-center
                        gap-2
                        text-sm
                        text-gray-500
                        transition
                        hover:text-white
                    "
                >

                    <span
                        class="
                            material-symbols-outlined
                            text-base
                        "
                    >
                        arrow_back
                    </span>

                    Continue shopping

                </a>

            </div>

        </section>


        <!-- =====================================================
             FOOTER
        ====================================================== -->

        <p
            class="
                mt-6
                text-center
                text-[10px]
                text-gray-600
            "
        >
            © 2026 KHELZONE. Engineered for Performance.
        </p>

    </main>


<script>

    /* =========================================================
       SUPABASE CONFIG
    ========================================================= */

    const SUPABASE_URL =
        "https://antqexjhlsaynunlmzqa.supabase.co";


    /*
       CURRENT SUPABASE PUBLISHABLE KEY

       IMPORTANT:
       Agar ye key Supabase Dashboard ki current
       Publishable key hai to isi ko use karo.
    */

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_pGWCdhUgU9p4JTWUwSnj5g_1TosZQLu";


    /* =========================================================
       CHECK SUPABASE LIBRARY
    ========================================================= */

    if (!window.supabase) {

        console.error(
            "Supabase JavaScript library failed to load."
        );

        alert(
            "Supabase library load nahi hui. Internet connection check karo."
        );

    }


    /* =========================================================
       CREATE SUPABASE CLIENT
    ========================================================= */

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    const passwordIcon =
        document.getElementById("passwordIcon");

    const loginBtn =
        document.getElementById("loginBtn");

    const loginBtnText =
        document.getElementById("loginBtnText");

    const loginSpinner =
        document.getElementById("loginSpinner");

    const loginIcon =
        document.getElementById("loginIcon");

    const message =
        document.getElementById("message");


    /* =========================================================
       SHOW MESSAGE
    ========================================================= */

    function showMessage(
        text,
        type = "error"
    ) {

        message.textContent = text;

        message.className =
            "message rounded-xl border px-4 py-3 text-sm font-semibold";

        message.classList.remove("hidden");


        if (type === "success") {

            message.classList.add(
                "bg-green-500/10",
                "border-green-500/20",
                "text-green-300"
            );

        } else {

            message.classList.add(
                "bg-red-500/10",
                "border-red-500/20",
                "text-red-300"
            );
        }
    }


    /* =========================================================
       HIDE MESSAGE
    ========================================================= */

    function hideMessage() {

        message.textContent = "";

        message.classList.add("hidden");

    }


    /* =========================================================
       LOADING
    ========================================================= */

    function setLoading(loading) {

        loginBtn.disabled = loading;


        if (loading) {

            loginBtnText.textContent =
                "Logging in...";

            loginSpinner.classList.remove(
                "hidden"
            );

            loginIcon.classList.add(
                "hidden"
            );

            loginBtn.classList.add(
                "opacity-70",
                "cursor-not-allowed"
            );

        } else {

            loginBtnText.textContent =
                "Login";

            loginSpinner.classList.add(
                "hidden"
            );

            loginIcon.classList.remove(
                "hidden"
            );

            loginBtn.classList.remove(
                "opacity-70",
                "cursor-not-allowed"
            );
        }
    }


    /* =========================================================
       PASSWORD SHOW / HIDE
    ========================================================= */

    togglePassword.addEventListener(
        "click",
        function () {

            const isHidden =
                passwordInput.type === "password";


            if (isHidden) {

                passwordInput.type = "text";

                passwordIcon.textContent =
                    "visibility_off";

                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                passwordInput.type = "password";

                passwordIcon.textContent =
                    "visibility";

                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );
            }

        }
    );


    /* =========================================================
       GET USER PROFILE
    ========================================================= */

    async function getProfile(userId) {

        const result =
            await supabaseClient
                .from("profiles")
                .select(
                    "role, full_name, email"
                )
                .eq("id", userId)
                .maybeSingle();


        if (result.error) {

            console.error(
                "PROFILE ERROR:",
                result.error
            );

            throw new Error(
                "Profile could not be loaded."
            );
        }


        if (!result.data) {

            throw new Error(
                "Your KHELZONE profile was not found."
            );
        }


        return result.data;
    }


    /* =========================================================
       REDIRECT BY ROLE
    ========================================================= */

    async function redirectByRole(user) {

        const profile =
            await getProfile(user.id);


        const role =
            String(
                profile.role || ""
            )
            .toLowerCase()
            .trim();


        console.log(
            "================================"
        );

        console.log(
            "KHELZONE LOGIN"
        );

        console.log(
            "User:",
            user.email
        );

        console.log(
            "Role:",
            role
        );

        console.log(
            "================================"
        );


        /* SAVE LOGIN INFORMATION */

        localStorage.setItem(
            "khelzone_role",
            role
        );

        localStorage.setItem(
            "khelzone_user_id",
            user.id
        );

        localStorage.setItem(
            "khelzone_email",
            user.email || ""
        );


        /* =====================================================
           ADMIN
        ===================================================== */

        if (role === "admin") {

            showMessage(
                "Admin login successful! Opening dashboard...",
                "success"
            );


            setTimeout(function () {

                window.location.replace(
                    "admin-dashboard.html"
                );

            }, 700);


            return;
        }


        /* =====================================================
           SELLER
        ===================================================== */

        if (role === "seller") {

            showMessage(
                "Seller login successful! Opening seller page...",
                "success"
            );


            setTimeout(function () {

                /*
                   IMPORTANT:
                   Seller login ke baad seller.html open hoga.
                */

                window.location.replace(
                    "seller.html"
                );

            }, 700);


            return;
        }


        /* =====================================================
           CUSTOMER
        ===================================================== */

        if (role === "customer") {

            showMessage(
                "Login successful! Opening KHELZONE...",
                "success"
            );


            setTimeout(function () {

                window.location.replace(
                    "homepage.html"
                );

            }, 700);


            return;
        }


        /* =====================================================
           INVALID ROLE
        ===================================================== */

        throw new Error(
            "Invalid KHELZONE role: " + role
        );
    }


    /* =========================================================
       LOGIN FORM
    ========================================================= */

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            hideMessage();

            setLoading(true);


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value;


            /* BASIC CHECK */

            if (!email || !password) {

                showMessage(
                    "Email aur password enter karo.",
                    "error"
                );

                setLoading(false);

                return;
            }


            try {

                /* =================================================
                   SUPABASE AUTH LOGIN
                ================================================= */

                const result =
                    await supabaseClient.auth
                        .signInWithPassword({

                            email:
                                email,

                            password:
                                password

                        });


                console.log(
                    "AUTH RESULT:",
                    result
                );


                /* =================================================
                   SUPABASE ERROR
                ================================================= */

                if (result.error) {

                    throw result.error;

                }


                /* =================================================
                   USER CHECK
                ================================================= */

                if (
                    !result.data ||
                    !result.data.user
                ) {

                    throw new Error(
                        "Login failed. User account was not returned."
                    );

                }


                /* =================================================
                   ROLE + REDIRECT
                ================================================= */

                await redirectByRole(
                    result.data.user
                );

            }


            catch (error) {

                console.error(
                    "================================"
                );

                console.error(
                    "KHELZONE LOGIN ERROR:",
                    error
                );

                console.error(
                    "================================"
                );


                let errorMessage =
                    error?.message ||
                    "Login failed. Please try again.";


                const lowerMessage =
                    errorMessage.toLowerCase();


                /* =================================================
                   INVALID LOGIN
                ================================================= */

                if (
                    lowerMessage.includes(
                        "invalid login credentials"
                    )
                ) {

                    errorMessage =
                        "Incorrect email or password.";

                }


                /* =================================================
                   INVALID API KEY
                ================================================= */

                else if (
                    lowerMessage.includes(
                        "invalid api key"
                    )
                ) {

                    errorMessage =
                        "Supabase Publishable Key invalid hai. Supabase Dashboard se current Publishable Key copy karo.";

                }


                /* =================================================
                   PROFILE ERROR
                ================================================= */

                else if (
                    lowerMessage.includes(
                        "profile could not be loaded"
                    )
                ) {

                    errorMessage =
                        "Login successful hua, lekin profiles table se user profile load nahi ho saki.";

                }


                /* =================================================
                   PROFILE NOT FOUND
                ================================================= */

                else if (
                    lowerMessage.includes(
                        "profile was not found"
                    )
                ) {

                    errorMessage =
                        "Login successful hua, lekin is user ka profiles record nahi mila.";

                }


                /* =================================================
                   EMAIL NOT CONFIRMED
                ================================================= */

                else if (
                    lowerMessage.includes(
                        "email not confirmed"
                    )
                ) {

                    errorMessage =
                        "Email abhi confirm nahi hui. Supabase Authentication mein email confirm karo.";

                }


                /* =================================================
                   NETWORK
                ================================================= */

                else if (
                    lowerMessage.includes(
                        "failed to fetch"
                    )
                ) {

                    errorMessage =
                        "Supabase se connection nahi ho raha. Internet aur Supabase URL check karo.";

                }


                /* =================================================
                   SHOW ERROR
                ================================================= */

                showMessage(
                    errorMessage,
                    "error"
                );


                setLoading(false);

            }

        }
    );


    /* =========================================================
       CHECK EXISTING SESSION
    ========================================================= */

    async function checkExistingSession() {

        try {

            const result =
                await supabaseClient.auth
                    .getSession();


            if (result.error) {

                console.error(
                    "SESSION ERROR:",
                    result.error
                );

                return;
            }


            const session =
                result.data?.session;


            if (session?.user) {

                console.log(
                    "Existing session found:",
                    session.user.email
                );

            }

        } catch (error) {

            console.error(
                "SESSION CHECK ERROR:",
                error
            );
        }
    }


    /* =========================================================
       START
    ========================================================= */

    checkExistingSession();

</script>

</body>
</html>
