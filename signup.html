<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHELZONE | Create Account</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(255,90,0,.18), transparent 35%),
                radial-gradient(circle at bottom left, rgba(255,90,0,.08), transparent 30%),
                #08090b;
            color: white;
        }
        .signup-card {
            background: rgba(18,20,24,.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,.09);
            box-shadow: 0 25px 70px rgba(0,0,0,.55), 0 0 40px rgba(255,90,0,.05);
        }
        .orange-gradient {
            background: linear-gradient(135deg,#ff5a00 0%,#d63f00 100%);
        }
        .orange-gradient:hover {
            background: linear-gradient(135deg,#ff6818 0%,#d63f00 100%);
        }
        .input-box {
            background: rgba(255,255,255,.04) !important;
            border: 1px solid rgba(255,255,255,.10) !important;
            color: white !important;
        }
        .input-box:focus {
            border-color: #ff5a00 !important;
            box-shadow: 0 0 0 3px rgba(255,90,0,.12) !important;
        }
        .input-box::placeholder { color: #6b7280; }
        .spinner {
            width: 19px; height: 19px;
            border: 2px solid rgba(255,255,255,.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        .otp-box {
            width: 46px;
            height: 54px;
            text-align: center;
            font-size: 1.35rem;
            font-weight: 800;
            border-radius: .8rem;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.12);
            color: white;
            outline: none;
        }
        .otp-box:focus {
            border-color: #ff5a00;
            box-shadow: 0 0 0 3px rgba(255,90,0,.12);
        }
        @media (max-width: 430px) {
            .otp-box { width: 40px; height: 50px; }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body class="flex items-center justify-center px-4 py-10">
<main class="w-full max-w-md">

    <!-- LOGO: intentionally NOT clickable -->
    <div class="block text-center mb-8">
        <div class="text-4xl sm:text-5xl font-black tracking-tight text-orange-500">
            KHELZONE
        </div>
        <div class="mt-2 text-[10px] sm:text-xs font-bold tracking-[0.28em] text-gray-500">
            ENGINEERED FOR PERFORMANCE
        </div>
    </div>

    <section class="signup-card rounded-3xl p-6 sm:p-8">

        <!-- SIGNUP VIEW -->
        <div id="signupView">
            <div class="text-center mb-7">
                <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-orange-500/10 border border-orange-500/20">
                    <span class="material-symbols-outlined text-orange-500 text-3xl">person_add</span>
                </div>
                <h1 class="mt-5 text-3xl font-black uppercase">Create Account</h1>
                <p class="mt-2 text-sm text-gray-500">Join KHELZONE today</p>
            </div>

            <form id="signupForm" class="space-y-5">
                <div>
                    <label for="fullName" class="mb-2 block text-xs font-bold uppercase tracking-wider text-gray-400">Full Name</label>
                    <input id="fullName" type="text" required autocomplete="name"
                        placeholder="Enter your full name"
                        class="input-box w-full rounded-xl px-4 py-3.5 outline-none transition">
                </div>

                <div>
                    <label for="email" class="mb-2 block text-xs font-bold uppercase tracking-wider text-gray-400">Email</label>
                    <input id="email" type="email" required autocomplete="email"
                        placeholder="Enter your email"
                        class="input-box w-full rounded-xl px-4 py-3.5 outline-none transition">
                </div>

                <div>
                    <label for="password" class="mb-2 block text-xs font-bold uppercase tracking-wider text-gray-400">Password</label>
                    <div class="relative">
                        <input id="password" type="password" required minlength="6" autocomplete="new-password"
                            placeholder="Create a password"
                            class="input-box w-full rounded-xl px-4 py-3.5 pr-12 outline-none transition">
                        <button type="button" id="togglePassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white">
                            <span id="passwordIcon" class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirmPassword" class="mb-2 block text-xs font-bold uppercase tracking-wider text-gray-400">Confirm Password</label>
                    <input id="confirmPassword" type="password" required minlength="6" autocomplete="new-password"
                        placeholder="Confirm your password"
                        class="input-box w-full rounded-xl px-4 py-3.5 outline-none transition">
                </div>

                <div id="signupMessage" class="hidden rounded-xl border px-4 py-3 text-sm font-semibold"></div>

                <button id="signupBtn" type="submit"
                    class="orange-gradient w-full rounded-xl py-4 font-black uppercase tracking-wide text-white flex items-center justify-center gap-2 transition hover:scale-[1.01] active:scale-[.99]">
                    <span id="signupBtnText">Create Account</span>
                    <span id="signupSpinner" class="spinner hidden"></span>
                    <span id="signupIcon" class="material-symbols-outlined">arrow_forward</span>
                </button>
            </form>

            <div class="mt-7 text-center">
                <p class="text-sm text-gray-500">
                    Already have an account?
                    <a href="index.html" class="font-bold text-orange-400 hover:text-orange-300">Login</a>
                </p>
            </div>

            <div class="mt-7 border-t border-white/10 pt-6">
                <a href="homepage.html" class="flex items-center justify-center gap-2 text-sm text-gray-500 hover:text-white">
                    <span class="material-symbols-outlined text-base">arrow_back</span>
                    Continue shopping
                </a>
            </div>
        </div>

        <!-- OTP VIEW -->
        <div id="otpView" class="hidden">
            <div class="text-center mb-7">
                <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-orange-500/10 border border-orange-500/20">
                    <span class="material-symbols-outlined text-orange-500 text-3xl">mark_email_unread</span>
                </div>
                <h1 class="mt-5 text-3xl font-black uppercase">Verify Email</h1>
                <p class="mt-2 text-sm text-gray-400">
                    6-digit code enter karo jo tumhare actual email inbox mein aaya hai.
                </p>
                <p id="pendingEmailText" class="mt-2 text-sm font-bold text-orange-400 break-all"></p>
            </div>

            <div id="otpMessage" class="hidden mb-5 rounded-xl border px-4 py-3 text-sm font-semibold"></div>

            <div id="otpInputs" class="flex justify-center gap-2 mb-6" aria-label="Email verification code">
                <input class="otp-box" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit 1">
                <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="Digit 2">
                <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="Digit 3">
                <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="Digit 4">
                <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="Digit 5">
                <input class="otp-box" inputmode="numeric" maxlength="1" aria-label="Digit 6">
            </div>

            <button id="verifyBtn" type="button"
                class="orange-gradient w-full rounded-xl py-4 font-black uppercase tracking-wide text-white flex items-center justify-center gap-2 transition disabled:opacity-50 disabled:cursor-not-allowed">
                <span id="verifyBtnText">Verify Email</span>
                <span id="verifySpinner" class="spinner hidden"></span>
            </button>

            <button id="resendBtn" type="button"
                class="mt-4 w-full rounded-xl border border-white/10 bg-white/5 py-3.5 font-bold text-gray-200 hover:bg-white/10 disabled:opacity-50 disabled:cursor-not-allowed">
                <span id="resendBtnText">Resend OTP</span>
            </button>

            <p id="cooldownText" class="mt-3 text-center text-xs text-gray-500"></p>

            <button id="backToSignupBtn" type="button"
                class="mt-5 w-full text-sm text-gray-500 hover:text-white">
                Use a different email
            </button>
        </div>

    </section>

    <p class="mt-6 text-center text-[10px] text-gray-600">
        © 2026 KHELZONE. Engineered for Performance.
    </p>
</main>

<script>
"use strict";

/* =========================================================
   SUPABASE
   Publishable/anon key is safe for browser use.
   NEVER put service_role, SMTP password, or API secret here.
========================================================= */
const SUPABASE_URL = "https://antqexjhlsaynunlmzqa.supabase.co";
const SUPABASE_KEY = "sb_publishable_pGWCdhUgU9p4JTWUwSnj5g_1TosZQLu";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* =========================================================
   ELEMENTS
========================================================= */
const signupView = document.getElementById("signupView");
const otpView = document.getElementById("otpView");

const signupForm = document.getElementById("signupForm");
const fullNameInput = document.getElementById("fullName");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");

const togglePassword = document.getElementById("togglePassword");
const passwordIcon = document.getElementById("passwordIcon");

const signupBtn = document.getElementById("signupBtn");
const signupBtnText = document.getElementById("signupBtnText");
const signupSpinner = document.getElementById("signupSpinner");
const signupIcon = document.getElementById("signupIcon");
const signupMessage = document.getElementById("signupMessage");

const pendingEmailText = document.getElementById("pendingEmailText");
const otpMessage = document.getElementById("otpMessage");
const otpBoxes = Array.from(document.querySelectorAll(".otp-box"));

const verifyBtn = document.getElementById("verifyBtn");
const verifyBtnText = document.getElementById("verifyBtnText");
const verifySpinner = document.getElementById("verifySpinner");

const resendBtn = document.getElementById("resendBtn");
const resendBtnText = document.getElementById("resendBtnText");
const cooldownText = document.getElementById("cooldownText");
const backToSignupBtn = document.getElementById("backToSignupBtn");

/* =========================================================
   STATE
========================================================= */
let pendingEmail = "";
let wrongAttempts = 0;
const MAX_WRONG_ATTEMPTS = 5;

let resendTimer = null;
let resendAvailableAt = 0;

/* =========================================================
   MESSAGE HELPERS
========================================================= */
function showMessage(element, text, type = "error") {
    element.textContent = text;
    element.className = "rounded-xl border px-4 py-3 text-sm font-semibold";

    if (type === "success") {
        element.classList.add(
            "bg-green-500/10",
            "border-green-500/20",
            "text-green-300"
        );
    } else {
        element.classList.add(
            "bg-red-500/10",
            "border-red-500/20",
            "text-red-300"
        );
    }
}

function hideMessage(element) {
    element.classList.add("hidden");
}

/* =========================================================
   LOADING
========================================================= */
function setSignupLoading(loading) {
    signupBtn.disabled = loading;

    if (loading) {
        signupBtnText.textContent = "Creating...";
        signupSpinner.classList.remove("hidden");
        signupIcon.classList.add("hidden");
        signupBtn.classList.add("opacity-70", "cursor-not-allowed");
    } else {
        signupBtnText.textContent = "Create Account";
        signupSpinner.classList.add("hidden");
        signupIcon.classList.remove("hidden");
        signupBtn.classList.remove("opacity-70", "cursor-not-allowed");
    }
}

function setVerifyLoading(loading) {
    verifyBtn.disabled = loading;
    resendBtn.disabled = loading || Date.now() < resendAvailableAt;

    if (loading) {
        verifyBtnText.textContent = "Verifying...";
        verifySpinner.classList.remove("hidden");
    } else {
        verifyBtnText.textContent = "Verify Email";
        verifySpinner.classList.add("hidden");
        updateResendButton();
    }
}

/* =========================================================
   PASSWORD SHOW / HIDE
========================================================= */
togglePassword.addEventListener("click", () => {
    const hidden = passwordInput.type === "password";
    passwordInput.type = hidden ? "text" : "password";
    passwordIcon.textContent = hidden ? "visibility_off" : "visibility";
});

/* =========================================================
   OTP HELPERS
========================================================= */
function getOtp() {
    return otpBoxes.map(box => box.value).join("");
}

function clearOtp() {
    otpBoxes.forEach(box => box.value = "");
    otpBoxes[0].focus();
}

function showOtpScreen(email) {
    pendingEmail = email;
    pendingEmailText.textContent = email;
    signupView.classList.add("hidden");
    otpView.classList.remove("hidden");
    hideMessage(otpMessage);
    clearOtp();
    otpBoxes[0].focus();
    startResendCooldown(60);
}

function returnToSignup() {
    if (resendTimer) clearInterval(resendTimer);
    signupView.classList.remove("hidden");
    otpView.classList.add("hidden");
    hideMessage(otpMessage);
    hideMessage(signupMessage);
    clearOtp();
    emailInput.focus();
}

/* =========================================================
   OTP INPUT
   - digits only
   - paste 6 digits
   - next/previous
   - arrows
========================================================= */
otpBoxes.forEach((box, index) => {
    box.addEventListener("input", (event) => {
        const digits = event.target.value.replace(/\D/g, "");

        if (digits.length > 1) {
            const six = digits.slice(0, 6);
            six.split("").forEach((digit, offset) => {
                if (otpBoxes[index + offset]) {
                    otpBoxes[index + offset].value = digit;
                }
            });
            const next = Math.min(index + six.length, otpBoxes.length - 1);
            otpBoxes[next].focus();
        } else {
            event.target.value = digits;
            if (digits && index < otpBoxes.length - 1) {
                otpBoxes[index + 1].focus();
            }
        }

        if (getOtp().length === 6) {
            verifyBtn.focus();
        }
    });

    box.addEventListener("keydown", (event) => {
        if (event.key === "Backspace" && !box.value && index > 0) {
            otpBoxes[index - 1].focus();
            otpBoxes[index - 1].value = "";
        }

        if (event.key === "ArrowLeft" && index > 0) {
            event.preventDefault();
            otpBoxes[index - 1].focus();
        }

        if (event.key === "ArrowRight" && index < otpBoxes.length - 1) {
            event.preventDefault();
            otpBoxes[index + 1].focus();
        }
    });

    box.addEventListener("paste", (event) => {
        event.preventDefault();
        const pasted = (event.clipboardData || window.clipboardData)
            .getData("text")
            .replace(/\D/g, "")
            .slice(0, 6);

        if (!pasted) return;

        pasted.split("").forEach((digit, i) => {
            if (otpBoxes[i]) otpBoxes[i].value = digit;
        });

        otpBoxes[Math.min(pasted.length, 6) - 1]?.focus();
    });
});

/* =========================================================
   RESEND COOLDOWN
========================================================= */
function startResendCooldown(seconds) {
    if (resendTimer) clearInterval(resendTimer);

    resendAvailableAt = Date.now() + (seconds * 1000);
    updateResendButton();

    resendTimer = setInterval(() => {
        updateResendButton();

        if (Date.now() >= resendAvailableAt) {
            clearInterval(resendTimer);
            resendTimer = null;
            updateResendButton();
        }
    }, 250);
}

function updateResendButton() {
    const remaining = Math.max(
        0,
        Math.ceil((resendAvailableAt - Date.now()) / 1000)
    );

    if (remaining > 0) {
        resendBtn.disabled = true;
        resendBtnText.textContent = `Resend OTP (${remaining}s)`;
        cooldownText.textContent = "Naya OTP request karne se pehle cooldown complete hone do.";
    } else {
        resendBtn.disabled = false;
        resendBtnText.textContent = "Resend OTP";
        cooldownText.textContent = "";
    }
}

/* =========================================================
   SIGNUP
   Important:
   signUp() returning data.user does NOT prove email delivery.
   With Confirm Email enabled, session should normally be null.
========================================================= */
signupForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    hideMessage(signupMessage);

    const fullName = fullNameInput.value.trim();
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (!fullName) {
        showMessage(signupMessage, "Apna full name enter karo.");
        return;
    }

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMessage(signupMessage, "Valid email address enter karo.");
        return;
    }

    if (password.length < 6) {
        showMessage(signupMessage, "Password kam az kam 6 characters ka hona chahiye.");
        return;
    }

    if (password !== confirmPassword) {
        showMessage(signupMessage, "Passwords match nahi kar rahe.");
        return;
    }

    setSignupLoading(true);

    try {
        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: fullName,
                    role: "customer"
                }
            }
        });

        console.log("SUPABASE SIGNUP RESPONSE:", data);
        console.log("SUPABASE SIGNUP ERROR:", error);

        if (error) {
            throw error;
        }

        if (!data || !data.user) {
            throw new Error("Account create nahi hua.");
        }

        /*
         * Do NOT show "OTP sent" merely because data.user exists.
         * Supabase's client response cannot prove inbox delivery.
         *
         * If Confirm Email is enabled, the correct next step is to
         * show the OTP screen and let the user enter the code received
         * in their real inbox.
         */
        wrongAttempts = 0;
        showOtpScreen(email);

        showMessage(
            otpMessage,
            "Account create ho gaya. Ab apne email inbox mein KHELZONE verification code check karo.",
            "success"
        );

    } catch (error) {
        console.error("SIGNUP ERROR:", error);

        const raw = String(error?.message || "").toLowerCase();
        let userMessage = "Account create nahi ho saka. Dobara try karo.";

        if (
            raw.includes("already registered") ||
            raw.includes("user already registered")
        ) {
            userMessage = "Ye email already registered hai. Please login karo.";
        } else if (raw.includes("invalid email") || raw.includes("email address")) {
            userMessage = "Valid email address enter karo.";
        } else if (
            raw.includes("rate") ||
            raw.includes("too many") ||
            raw.includes("429")
        ) {
            userMessage = "Bohat zyada attempts ho gaye hain. Thori dair baad dobara try karo.";
        } else if (
            raw.includes("not authorized") ||
            raw.includes("email address not authorized")
        ) {
            userMessage = "Supabase ka default email service is address par email bhejne ki ijazat nahi de raha. Custom SMTP configure karo.";
        } else if (
            raw.includes("smtp") ||
            raw.includes("email")
        ) {
            userMessage = "Account request hui, lekin email service mein problem aa rahi hai. Supabase SMTP/email configuration check karo.";
        }

        showMessage(signupMessage, userMessage);
    } finally {
        setSignupLoading(false);
    }
});

/* =========================================================
   VERIFY OTP
   Current Supabase JS docs use type: "email" for email OTP
   verification. "signup" is not the recommended JS type.
========================================================= */
verifyBtn.addEventListener("click", async () => {
    if (!pendingEmail) {
        showMessage(otpMessage, "Email session missing hai. Signup dobara karo.");
        return;
    }

    if (wrongAttempts >= MAX_WRONG_ATTEMPTS) {
        showMessage(
            otpMessage,
            "5 wrong attempts ho chuke hain. Pehle new OTP resend karo."
        );
        return;
    }

    const token = getOtp();

    if (!/^\d{6}$/.test(token)) {
        showMessage(otpMessage, "Complete 6-digit OTP enter karo.");
        return;
    }

    hideMessage(otpMessage);
    setVerifyLoading(true);

    try {
        const { data, error } = await supabaseClient.auth.verifyOtp({
            email: pendingEmail,
            token: token,
            type: "email"
        });

        console.log("VERIFY OTP RESPONSE:", data);
        console.log("VERIFY OTP ERROR:", error);

        if (error) {
            throw error;
        }

        /*
         * Successful verifyOtp response is the server-side proof that
         * the submitted OTP was accepted and the email was verified.
         */
        showMessage(
            otpMessage,
            "Email successfully verify ho gayi. Login page open ho raha hai...",
            "success"
        );

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1200);

    } catch (error) {
        console.error("VERIFY OTP ERROR:", error);

        wrongAttempts++;
        clearOtp();

        const raw = String(error?.message || "").toLowerCase();

        if (
            raw.includes("expired") ||
            raw.includes("invalid") ||
            raw.includes("token")
        ) {
            if (wrongAttempts >= MAX_WRONG_ATTEMPTS) {
                showMessage(
                    otpMessage,
                    "OTP invalid/expired hai aur 5 attempts ho chuke hain. New OTP resend karo."
                );
            } else {
                showMessage(
                    otpMessage,
                    `OTP invalid ya expired hai. Dobara check karo. Attempts left: ${MAX_WRONG_ATTEMPTS - wrongAttempts}.`
                );
            }
        } else if (raw.includes("rate") || raw.includes("too many") || raw.includes("429")) {
            showMessage(
                otpMessage,
                "Verification requests zyada ho gayi hain. Thori dair baad dobara try karo."
            );
        } else {
            showMessage(
                otpMessage,
                "OTP verify nahi ho saka. Code dobara check karo ya new OTP request karo."
            );
        }
    } finally {
        setVerifyLoading(false);
    }
});

/* =========================================================
   RESEND OTP
========================================================= */
resendBtn.addEventListener("click", async () => {
    if (!pendingEmail) {
        showMessage(otpMessage, "Email session missing hai. Signup dobara karo.");
        return;
    }

    if (Date.now() < resendAvailableAt) {
        updateResendButton();
        return;
    }

    resendBtn.disabled = true;
    resendBtnText.textContent = "Sending...";

    try {
        const { error } = await supabaseClient.auth.resend({
            type: "signup",
            email: pendingEmail
        });

        console.log("RESEND ERROR:", error);

        if (error) {
            throw error;
        }

        wrongAttempts = 0;
        clearOtp();

        showMessage(
            otpMessage,
            "Supabase ne resend request accept kar li hai. Apne inbox/spam folder mein naya code check karo.",
            "success"
        );

        startResendCooldown(60);

    } catch (error) {
        console.error("RESEND OTP ERROR:", error);

        const raw = String(error?.message || "").toLowerCase();

        if (
            raw.includes("rate") ||
            raw.includes("too many") ||
            raw.includes("429") ||
            raw.includes("60")
        ) {
            showMessage(
                otpMessage,
                "Abhi resend rate limit active hai. 60 seconds wait karke dobara try karo."
            );
        } else if (raw.includes("not authorized")) {
            showMessage(
                otpMessage,
                "Supabase default email service is address ko authorize nahi kar rahi. Custom SMTP configure karo."
            );
        } else {
            showMessage(
                otpMessage,
                "OTP resend nahi ho saka. Supabase email/SMTP configuration check karo."
            );
        }

        updateResendButton();
    }
});

/* =========================================================
   BACK
========================================================= */
backToSignupBtn.addEventListener("click", returnToSignup);

/* Initial state */
updateResendButton();
</script>
</body>
</html>
