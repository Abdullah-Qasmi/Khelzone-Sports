  /* Rotate stage - no clipping, image sits fully visible */

  #jersey-render.spinning { transition: transform 1.4s cubic-bezier(0.65,0,0.35,1); }
  #jersey-render.grabbing { cursor: grabbing !important; transition: none !important; }

<!-- Tabs -->

<script>
(function () {
  var render = document.getElementById('jersey-render');
  var stage = document.getElementById('jersey-stage');
  var rotateY = 0;
  var isDragging = false;
  var lastX = 0;
  var autoSpin = null;

  function applyTransform() {
    render.style.transform = 'rotateY(' + rotateY + 'deg)';
  }

  // Drag to rotate
  function startDrag(x) {
    isDragging = true;
    lastX = x;
    render.classList.add('grabbing');
    stopAutoSpin();
  }
  function moveDrag(x) {
    if (!isDragging) return;
    var delta = x - lastX;
    lastX = x;
    rotateY += delta * 0.6;
    applyTransform();
  }
  function endDrag() {
    isDragging = false;
    render.classList.remove('grabbing');
  }

  stage.addEventListener('mousedown', function (e) { startDrag(e.clientX); });
  window.addEventListener('mousemove', function (e) { moveDrag(e.clientX); });
  window.addEventListener('mouseup', endDrag);

  stage.addEventListener('touchstart', function (e) { startDrag(e.touches[0].clientX); }, { passive: true });
  window.addEventListener('touchmove', function (e) { moveDrag(e.touches[0].clientX); }, { passive: true });
  window.addEventListener('touchend', endDrag);

  // 360 button - smooth full spin
  function stopAutoSpin() {
    if (autoSpin) { clearTimeout(autoSpin); autoSpin = null; }
    render.classList.remove('spinning');
  }
  document.getElementById('btn-rotate').addEventListener('click', function () {
    render.classList.add('spinning');
    rotateY += 360;
    applyTransform();
    autoSpin = setTimeout(function () { render.classList.remove('spinning'); }, 1450);
  });

  // Flip front/back
  document.getElementById('btn-flip').addEventListener('click', function () {
    render.classList.add('spinning');
    rotateY += 180;
    applyTransform();
    autoSpin = setTimeout(function () { render.classList.remove('spinning'); }, 1450);
  });

  // Reset view
  document.getElementById('btn-reset').addEventListener('click', function () {
    render.classList.add('spinning');
    rotateY = 0;
    applyTransform();
    autoSpin = setTimeout(function () { render.classList.remove('spinning'); }, 1450);
  });

  // Zoom toggle
  var zoomed = false;
  document.getElementById('btn-zoom').addEventListener('click', function () {
    zoomed = !zoomed;
    render.style.width = zoomed ? '130%' : '100%';
    render.style.height = zoomed ? '130%' : '100%';
    render.style.marginLeft = zoomed ? '-15%' : '0';
  });
})();
</script>
<script src="customization.js"></script>
</body>
